name: Build AERA Recovery (Android 16)

on:
  workflow_dispatch:
    inputs:
      DEVICE_CODE:
        description: 'Device codename (e.g. camellia)'
        required: true
        default: 'camellia'
      DEVICE_TREE_URL:
        description: 'Device tree git URL'
        required: true
        default: 'https://github.com/HIZVOICE/android_device_xiaomi_camellia-AERA'
      DEVICE_TREE_BRANCH:
        description: 'Device tree branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device tree path in the source (e.g. device/xiaomi/camellia)'
        required: true
        default: 'device/xiaomi/camellia'
      BUILD_TARGET:
        description: 'Build target (recoveryimage or bootimage)'
        required: true
        default: 'bootimage'

jobs:
  build:
    name: Build AERA Recovery
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 1. Check out workflow repo
        uses: actions/checkout@v4

      - name: 2. Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          # Build #6 (run 42336623555) PROVED the 4096/4096/4096 reserve cut
          # breaks this step: it died in 82s with repeated "fallocate:
          # invalid length value specified". Reverted to the values that
          # passed this step in builds #1-#5. Do NOT shrink these reserves
          # again without evidence; the ENOSPC fix rests on the sync-side
          # changes below (longer attempts, explicit --depth=1, disk guard).
          root-reserve-mb: 16384
          temp-reserve-mb: 12288
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 3. Check disk and memory
        run: |
          df -h
          free -h

      - name: 4. Install Android 16 build dependencies and repo tool
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32ncurses5-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python-is-python3 rsync lz4 bc ccache

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

          git config --global user.name "AERA-Builder"
          git config --global user.email "builder@github.local"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: 5. Init manifest and sync AERA 16.0 source
        run: |
          # Build inside $GITHUB_WORKSPACE (the ~115GB volume), not ~ (12GB root)
          WORKDIR="${GITHUB_WORKSPACE}/aera_workspace"
          mkdir -p "${WORKDIR}"
          cd "${WORKDIR}"

          echo "=== Init manifest ==="
          repo init --depth=1 -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0

          # Rewrite any ssh:// remotes in the manifest to https://
          find .repo/manifests -name "*.xml" -exec sed -i 's|ssh://git@github.com/|https://github.com/|g' {} + || true

          echo "=== Network probe ==="
          git ls-remote https://github.com/AERA-Recovery/android_manifest.git aera-16.0 | head -2

          echo "=== Shallow sync ==="
          # Builds #1 and #3 died in this step: repo sync produced NO output
          # at all and GitHub reported the hosted runner "lost communication"
          # after ~63-66 min of silence. Build #2, with identical sync code,
          # synced fine in ~20 min — so this is runner fragility on a
          # 1,039-project manifest, not a code error. Defences:
          #  - heartbeat: a background loop prints .repo size and disk free
          #    every 60s, so the runner never sits silent for an hour.
          #  - -j2 instead of -j4: halves parallel git memory pressure.
          #  - GIT_TERMINAL_PROMPT=0: a dead/private remote must FAIL FAST,
          #    never block forever on a hidden credential prompt.
          #  - a completeness sentinel: an incomplete sync fails loudly here
          #    instead of passing a broken tree to the build step.
          # Build #5 (run 42327642579) changed the picture: the sync did NOT
          # hang — it died on ENOSPC (OSError 28). .repo grew to 48G and free
          # disk fell 79G -> 209M across attempts 1-2; attempts 3-4 died
          # instantly on the same error. Build #4 had squeaked through at
          # .repo 21G / 9.5G free, so sync + working tree only just fits the
          # ~115G volume and any drift kills it. Fixes in this revision:
          #  - 45-min per-attempt timeout (was 20): a killed attempt leaves
          #    orphaned packfiles behind, so the resume loop itself bloats
          #    .repo; one long attempt should finish the sync outright
          #    (build #4's whole sync took 24m15s). 3 attempts, not 4.
          #  - --depth=1 passed explicitly to repo sync (init already sets
          #    it, but resume attempts must stay shallow too).
          #  - disk guard: fail fast with a clear message if free space is
          #    under 15G at an attempt's start, instead of burning 30 min.
          export GIT_TERMINAL_PROMPT=0
          SYNC_OK=0
          for attempt in 1 2 3; do
            echo "--- sync attempt ${attempt} ---"
            echo "free disk at attempt start: $(df -h . | tail -1 | awk '{print $4}')"
            FREE_GB=$(df --output=avail -BG . | tail -1 | tr -dc '0-9')
            if [ "${FREE_GB}" -lt 15 ]; then
              echo "ERROR: only ${FREE_GB}G free at attempt start — sync cannot fit; aborting"
              exit 1
            fi
            ( while true; do sleep 60; echo "[heartbeat] attempt ${attempt}: .repo=$(du -sh .repo 2>/dev/null | cut -f1), disk free=$(df -h . | tail -1 | awk '{print $4}')"; done ) &
            HB_PID=$!
            if timeout 2700 repo sync -c --depth=1 --no-clone-bundle --no-tags --prune -j2 --verbose; then
              kill ${HB_PID} 2>/dev/null || true
              SYNC_OK=1
              break
            fi
            kill ${HB_PID} 2>/dev/null || true
            echo "sync attempt ${attempt} incomplete — resuming in 15s"
            sleep 15
          done
          if [ "${SYNC_OK}" != "1" ] || [ ! -f build/envsetup.sh ]; then
            echo "ERROR: source sync did not complete after 3 attempts"
            exit 1
          fi
          echo "=== Sync complete ==="

          echo "=== Unpack the device tree (bootstrap zip) ==="
          # NOTE (build #2, run 42310894458): the sync itself SUCCEEDED on
          # attempt 1 — the failure was this unzip: tree.zip was not at
          # $GITHUB_WORKSPACE/tree.zip. Cause: step 2 (maximize-build-space)
          # mounts a fresh LVM volume OVER $GITHUB_WORKSPACE by default,
          # hiding everything step 1 checked out. So re-fetch tree.zip here,
          # after the mount, straight from the repo (public, no auth).
          TREE_RAW="$(echo "${{ github.event.inputs.DEVICE_TREE_URL }}" | sed 's|https://github.com/|https://raw.githubusercontent.com/|')/${{ github.event.inputs.DEVICE_TREE_BRANCH }}/tree.zip"
          echo "Fetching ${TREE_RAW}"
          curl -sL --retry 3 -o "${GITHUB_WORKSPACE}/tree.zip" "${TREE_RAW}"
          ls -lh "${GITHUB_WORKSPACE}/tree.zip"
          test "$(stat -c%s "${GITHUB_WORKSPACE}/tree.zip")" -gt 10000000 || { echo "ERROR: tree.zip download looks wrong (too small)"; exit 1; }
          mkdir -p ${{ github.event.inputs.DEVICE_PATH }}
          unzip -q "${GITHUB_WORKSPACE}/tree.zip" -d ${{ github.event.inputs.DEVICE_PATH }}
          ls ${{ github.event.inputs.DEVICE_PATH }}

      - name: 6. Delete .repo to reclaim ~20GB
        run: |
          WORKDIR="${GITHUB_WORKSPACE}/aera_workspace"
          cd "${WORKDIR}"
          df -h "${WORKDIR}"
          echo "Removing .repo to free up ~20GB of disk space..."
          rm -rf .repo
          df -h "${WORKDIR}"

      - name: 7. Build
        env:
          # Soong Go memory tuning to avoid OOM during Android 16 analysis
          GOGC: "50"
          GOMEMLIMIT: "12GiB"
          ALLOW_MISSING_DEPENDENCIES: "true"
        run: |
          WORKDIR="${GITHUB_WORKSPACE}/aera_workspace"
          cd "${WORKDIR}"
          source build/envsetup.sh

          echo "=== Lunch ==="
          TARGET="${{ github.event.inputs.DEVICE_CODE }}"
          lunch twrp_${TARGET}-bp2a-eng || lunch aera_${TARGET}-bp2a-eng || lunch twrp_${TARGET}-eng || lunch omni_${TARGET}-eng

          echo "=== Build ${{ github.event.inputs.BUILD_TARGET }} ==="
          if command -v mka >/dev/null 2>&1; then
            mka ${{ github.event.inputs.BUILD_TARGET }} -j$(nproc --all)
          else
            m ${{ github.event.inputs.BUILD_TARGET }}
          fi

          echo "=== Collect artifacts ==="
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          find "out/target/product/${TARGET}" -maxdepth 1 \( -name "*.img" -o -name "*.zip" \) -exec cp {} "${GITHUB_WORKSPACE}/artifacts/" \;
          ls -lh "${GITHUB_WORKSPACE}/artifacts/"

      - name: 8. Upload artifacts to a GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: AERA-${{ github.event.inputs.DEVICE_CODE }}-${{ github.run_id }}
          name: AERA Recovery for ${{ github.event.inputs.DEVICE_CODE }} (Android 16)
          files: |
            ${{ github.workspace }}/artifacts/*.img
            ${{ github.workspace }}/artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
